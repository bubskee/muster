# Illustrative counterfactual Watchline controls.
# These are not claims about controls actually deployed by Anthropic, PyPI,
# or the affected security vendor.

id: anthropic-pypi-notebook-control-pool

controls:
  - id: detect-unexpected-internet
    role: vedette
    events: [reach-public-internet]
    substrate: eval-network-telemetry
    action: observe
    effects:
      add: [alert:unexpected-internet]

  - id: block-eval-internet
    role: picket
    events: [reach-public-internet]
    substrate: eval-egress-policy
    action: block

  - id: block-public-package-publish
    role: picket
    events: [publish-malicious-package]
    substrate: registry-write-policy
    action: block

  - id: review-unexpected-internet
    events: [reach-public-internet]
    requires:
      present: [alert:unexpected-internet]
    substrate: eval-monitoring
    action: review
    effects:
      add: [reviewed:unexpected-internet]

  - id: assess-eval-boundary-critical
    events: [reach-public-internet]
    requires:
      present: [reviewed:unexpected-internet]
    action: critical
    effects:
      add: [critical:eval-boundary]

  - id: escalate-eval-termination
    events: [reach-public-internet]
    requires:
      present: [critical:eval-boundary]
    action: escalate
    effects:
      add: [escalated:eval-termination]

  - id: terminate-evaluation
    role: reserve
    events: [reach-public-internet]
    requires:
      present: [escalated:eval-termination]
    action: respond
    effects:
      remove: [eval:ctf-active]

  - id: isolate-scanner-credentials
    role: picket
    events: [scanner-credential-exposure]
    substrate: scanner-sandbox
    action: block

  - id: detect-scanner-credential-exposure
    role: vedette
    events: [scanner-credential-exposure]
    substrate: vendor-security-telemetry
    action: observe
    effects:
      add: [alert:vendor-credential-exposure]

  - id: review-vendor-credential-exposure
    events: [scanner-credential-exposure]
    requires:
      present: [alert:vendor-credential-exposure]
    substrate: vendor-oncall
    action: review
    effects:
      add: [reviewed:vendor-credential-exposure]

  - id: assess-vendor-credential-critical
    events: [scanner-credential-exposure]
    requires:
      present: [reviewed:vendor-credential-exposure]
    action: critical
    effects:
      add: [critical:vendor-credential]

  - id: escalate-vendor-credential-revocation
    events: [scanner-credential-exposure]
    requires:
      present: [critical:vendor-credential]
    action: escalate
    effects:
      add: [escalated:vendor-credential-revocation]

  - id: revoke-vendor-credential
    role: reserve
    events: [scanner-credential-exposure]
    requires:
      present: [escalated:vendor-credential-revocation]
    action: respond
    effects:
      remove: [attacker:vendor-credential]
