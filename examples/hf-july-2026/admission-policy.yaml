# Counterfactual: reject the privileged hostPath pod described in the public
# timeline.

id: hf-admission-policy

controls:
  - id: correlate-worker-compromise
    role: vedette
    events:
      - dataset-template-rce
    substrate: security-telemetry
    action: observe
    effects:
      add:
        - alert:worker-compromise

  - id: reject-privileged-hostpath
    role: picket
    events:
      - privileged-hostpath-pod
    substrate: kubernetes-admission
    action: block
