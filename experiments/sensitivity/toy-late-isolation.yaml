id: toy-late-isolation
controls:
- id: worker-credential-theft
  role: vedette
  events:
  - cluster-credential-theft
  substrate: worker-telemetry
  action: observe
  effects:
    add:
    - alert:credential-theft

- id: worker-k8s-discovery
  role: vedette
  events:
  - kubernetes-api-discovery-from-worker
  substrate: worker-telemetry
  action: observe
  effects:
    add:
    - alert:k8s-discovery

- id: review-k8s-discovery
  events:
  - kubernetes-api-discovery-from-worker
  requires:
    present:
    - alert:k8s-discovery
  substrate: soc-queue
  action: review
  effects:
    add:
    - reviewed:cluster-integrity

- id: assess-cluster-integrity
  events:
  - kubernetes-api-discovery-from-worker
  requires:
    present:
    - reviewed:cluster-integrity
    - attacker:cluster-credential
  action: critical
  effects:
    add:
    - critical:cluster-integrity

- id: escalate-cluster-integrity
  events:
  - kubernetes-api-discovery-from-worker
  requires:
    present:
    - critical:cluster-integrity
  action: escalate
  effects:
    add:
    - escalated:cluster-integrity

- id: revoke-cluster-credential
  role: reserve
  events:
  - kubernetes-api-discovery-from-worker
  requires:
    present:
    - escalated:cluster-integrity
  action: respond
  effects:
    remove:
    - attacker:cluster-credential

- id: isolate-worker-late
  role: reserve
  events:
  - kubernetes-api-discovery-from-worker
  requires:
    present:
    - escalated:cluster-integrity
  action: respond
  effects:
    remove:
    - attacker:worker-access
