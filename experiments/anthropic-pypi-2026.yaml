id: anthropic-pypi-2026-owners
metrics:
  # Note: public:malicious-package is removed by the final registry-removes-package
  # event in every run, so it is never a terminal-state metric. Use execution instead.
  - id: third-party-exec
    fact: third-party:package-executed
  - id: vendor-db
    fact: attacker:vendor-database-access
runs:
  - id: monitor-only
    label: Eval operator - monitor egress only
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-monitor-only.yaml
  - id: block-egress
    label: Eval operator - block internet egress
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-block-egress.yaml
  - id: detect-terminate
    label: Eval operator - detect egress + terminate eval
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-detect-terminate.yaml
  - id: registry-block
    label: Registry - block publication
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-registry-block.yaml
  - id: vendor-sandbox
    label: Vendor - sandbox scanner credentials
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-vendor-sandbox.yaml
  - id: vendor-revoke
    label: Vendor - detect exposure + revoke
    scenario: ../examples/anthropic-pypi-2026/scenario.yaml
    controls: subsets/pypi-vendor-revoke.yaml
