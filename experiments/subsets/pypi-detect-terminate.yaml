id: pypi-detect-terminate
controls:
- id: detect-unexpected-internet
  role: vedette
  events:
  - reach-public-internet
  substrate: eval-network-telemetry
  action: observe
  effects:
    add:
    - alert:unexpected-internet
- id: review-unexpected-internet
  events:
  - reach-public-internet
  requires:
    present:
    - alert:unexpected-internet
  substrate: eval-monitoring
  action: review
  effects:
    add:
    - reviewed:unexpected-internet
- id: assess-eval-boundary-critical
  events:
  - reach-public-internet
  requires:
    present:
    - reviewed:unexpected-internet
  action: critical
  effects:
    add:
    - critical:eval-boundary
- id: escalate-eval-termination
  events:
  - reach-public-internet
  requires:
    present:
    - critical:eval-boundary
  action: escalate
  effects:
    add:
    - escalated:eval-termination
- id: terminate-evaluation
  role: reserve
  events:
  - reach-public-internet
  requires:
    present:
    - escalated:eval-termination
  action: respond
  effects:
    remove:
    - eval:ctf-active
